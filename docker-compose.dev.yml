# ==============================================================================
# DOCKER-COMPOSE OVERRIDE FOR DEVELOPMENT
# ==============================================================================
# This file extends docker-compose.yml for local development.
# Copy this to docker-compose.override.yml to use it.
# Docker Compose automatically applies overrides from this file.
#
# Usage:
#   cp docker-compose.dev.yml docker-compose.override.yml
#   docker-compose up -d
# ==============================================================================

version: '3.8'

services:
  # API with development configuration
  api:
    build:
      target: development
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
      - SQL_ECHO=true
    volumes:
      # Read-write for development
      -./app:/app/app:rw - ./alembic.ini:/app/alembic.ini:rw
    command: >
      sh -c "
        echo 'Development Mode - Waiting for database...' &&
        python -c 'import time; import psycopg2; 
        for i in range(30):
          try:
            psycopg2.connect(\"${DATABASE_URL}\")
            print(\"Database ready!\")
            break
          except:
            print(f\"Attempt {i+1}/30: Database not ready, waiting...\")
            time.sleep(2)
        else:
          print(\"Database timeout!\")
          exit(1)' &&
        echo 'Running migrations...' &&
        alembic upgrade head &&
        echo 'Starting with hot reload...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --log-level debug
      "

  # Celery worker with development configuration
  celery-worker:
    build:
      target: development
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    volumes:
      - ./app:/app/app:rw
    command: >
      sh -c "
        echo 'Development Mode - Starting Celery worker...' &&
        sleep 10 &&
        celery -A app.celery_app worker 
          --loglevel=debug 
          --concurrency=1
          --max-tasks-per-child=1
          --time-limit=300
      "

  # Enable Flower for monitoring
  flower:
    profiles: [] # Remove profile requirement for dev

  # Enable pgAdmin for database management
  pgadmin:
    profiles: [] # Remove profile requirement for dev
