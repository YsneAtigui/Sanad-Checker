version: '3.8'

services:
  api:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    env_file: .env
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - ./app:/app/app
      - ${STORAGE_PATH:-./storage}:/var/sanad/audits
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
  
  celery-worker:
    build: .
    env_file: .env
    depends_on:
      - postgres
      - redis
      - ollama
    volumes:
      - ./app:/app/app
      - ${STORAGE_PATH:-./storage}:/var/sanad/audits
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
  
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
